<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Deep Hill — onboard your venue, marketing inquiries, or general questions.">
  <title>Contact | Deep Hill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/deep-hill-logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact" data-base="">
  <div id="site-header"></div>

  <main>
    <section class="contact-page">
      <div class="container contact-page__inner">
        <header class="contact-page__header">
          <h1 class="contact-page__title">Contact Us</h1>
          <p class="contact-page__subtitle">Tell us how we can help. Your message is sent directly to our team at Deep Hill.</p>
        </header>

        <div id="contact-form-success" class="contact-form__success" hidden role="status">
          Thank you — we received your message and will get back to you soon.
        </div>

        <form
          class="contact-form"
          id="contact-form"
          action="https://formsubmit.co/support@deephill.in"
          method="POST"
        >
          <input type="hidden" name="_subject" value="Deep Hill website — new contact form">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://deephill.in/contact.html?sent=1">
          <input type="text" name="_honey" class="contact-form__honey" tabindex="-1" autocomplete="off" aria-hidden="true">

          <div class="contact-form__field">
            <label class="contact-form__label" for="reason">Reason</label>
            <select class="contact-form__input contact-form__select" id="reason" name="reason" required>
              <option value="" disabled selected>Select a reason</option>
              <option value="Onboard venue">Onboard venue</option>
              <option value="Marketing">Marketing</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="contact-form__row">
            <div class="contact-form__field">
              <label class="contact-form__label" for="name">Name</label>
              <input class="contact-form__input" type="text" id="name" name="name" required autocomplete="name" maxlength="200">
            </div>
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact">Contact number</label>
              <input class="contact-form__input" type="tel" id="contact" name="contact" required autocomplete="tel" inputmode="tel" maxlength="20">
            </div>
          </div>

          <div class="contact-form__field">
            <label class="contact-form__label" for="email">Email</label>
            <input class="contact-form__input" type="email" id="email" name="email" required autocomplete="email" maxlength="254">
          </div>

          <div class="contact-form__field">
            <label class="contact-form__label" for="purpose">Describe your purpose</label>
            <textarea class="contact-form__input contact-form__textarea" id="purpose" name="purpose" required rows="5" maxlength="4000" placeholder="Share a few details so we can respond effectively."></textarea>
          </div>

          <button type="submit" class="btn btn--primary btn--lg contact-form__submit">Send message</button>
          <p class="contact-form__note">We typically respond within one business day.</p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site-chrome.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
